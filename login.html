<!DOCTYPE html>
<html lang="my">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ဆိုင်သမားဝင်ရန် | အနီးအနားဝန်ဆောင်မှု</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/provider.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


<main class="provider-auth-page">


    <section class="provider-auth-card">


        <!-- =================================
             HEADER
        ================================== -->

        <div class="provider-auth-logo">

            <div class="provider-logo-icon">
                🏪
            </div>

            <h1>
                ဆိုင်သမားဝင်ရန်
            </h1>

            <p>
                သင့်ဆိုင်ကို စီမံခန့်ခွဲရန် ဝင်ရောက်ပါ
            </p>

        </div>


        <!-- =================================
             LOGIN FORM
        ================================== -->

        <form id="providerLoginForm">


            <!-- EMAIL -->

            <div class="provider-form-group">

                <label for="providerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="providerEmail"
                    placeholder="ဆိုင် Email ထည့်ပါ"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="provider-form-group">

                <label for="providerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="providerPassword"
                    placeholder="Password ထည့်ပါ"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="providerLoginBtn"
                class="provider-login-btn"
            >

                <span>
                    ဝင်မယ်
                </span>

            </button>


        </form>


        <!-- =================================
             MESSAGE
        ================================== -->

        <div
            id="providerLoginMessage"
            class="provider-auth-message"
            role="alert"
            aria-live="polite"
        ></div>


        <!-- =================================
             REGISTER
        ================================== -->

        <div class="provider-register-box">

            <p>
                သင့်ဆိုင်ကို ဒီ Platform မှာ တင်ချင်ပါသလား?
            </p>

            <a href="provider-register.html">

                🏪 ဆိုင်စာရင်းသွင်းရန်

            </a>

        </div>


        <!-- =================================
             BACK HOME
        ================================== -->

        <a
            href="index.html"
            class="provider-back-home"
        >

            ← ပင်မစာမျက်နှာသို့ ပြန်မယ်

        </a>


    </section>


</main>



<!-- =================================
     SUPABASE
================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =================================
     AUTH CONFIG
================================= -->

<script src="js/auth.js"></script>


<!-- =================================
     PROVIDER LOGIN
================================= -->

<script src="js/provider-login.js"></script>


</body>

</html>
