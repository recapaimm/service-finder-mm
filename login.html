<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ဝင်ရောက်ရန် | အနီးအနားဝန်ဆောင်မှု</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-logo-icon {
            font-size: 45px;
        }

        .auth-logo h1 {
            margin: 8px 0 5px;
            font-size: 24px;
        }

        .auth-logo p {
            margin: 0;
            opacity: .7;
        }

        .auth-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            background: #f1f1f1;
        }

        .auth-tab.active {
            background: #111;
            color: #fff;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #111;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-size: 17px;
            cursor: pointer;
        }

        .auth-submit:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .auth-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .auth-message.show {
            display: block;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <div class="auth-logo-icon">🔧</div>

                <h1>အနီးအနားဝန်ဆောင်မှု</h1>

                <p>သင့်အကောင့်ကို ဝင်ရောက်ပါ</p>
            </div>


            <!-- Tabs -->
            <div class="auth-tabs">

                <button
                    type="button"
                    class="auth-tab active"
                    id="loginTab"
                >
                    ဝင်မယ်
                </button>

                <button
                    type="button"
                    class="auth-tab"
                    id="signupTab"
                >
                    အကောင့်ဖွင့်မယ်
                </button>

            </div>


            <!-- Login -->
            <form
                class="auth-form active"
                id="loginForm"
            >

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="loginBtn"
                >
                    ဝင်မယ်
                </button>

            </form>


            <!-- Sign Up -->
            <form
                class="auth-form"
                id="signupForm"
            >

                <div class="form-group">

                    <label for="signupName">
                        အမည်
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="သင့်အမည်"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="your@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="အနည်းဆုံး 6 လုံး"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit"
                    id="signupBtn"
                >
                    အကောင့်ဖွင့်မယ်
                </button>

            </form>


            <div
                class="auth-message"
                id="authMessage"
            ></div>


            <a
                href="index.html"
                class="back-home"
            >
                ← ပင်မစာမျက်နှာသို့ ပြန်မယ်
            </a>

        </div>

    </main>


    <script>

        const loginTab = document.getElementById("loginTab");
        const signupTab = document.getElementById("signupTab");

        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        loginTab.addEventListener("click", () => {

            loginTab.classList.add("active");
            signupTab.classList.remove("active");

            loginForm.classList.add("active");
            signupForm.classList.remove("active");

        });


        signupTab.addEventListener("click", () => {

            signupTab.classList.add("active");
            loginTab.classList.remove("active");

            signupForm.classList.add("active");
            loginForm.classList.remove("active");

        });

    </script>

</body>
  </html>
