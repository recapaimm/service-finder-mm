<!DOCTYPE html>
<html lang="my">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ဆိုင်သမားဝင်ရန် | အနီးအနားဝန်ဆောင်မှု</title>


<link rel="stylesheet" href="css/style.css">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    font-family:
    "Noto Sans Myanmar",
    Arial,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #0f172a
    );

}


/* MAIN */

.auth-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/* CARD */

.auth-card{

    width:100%;

    max-width:420px;

    background:white;

    padding:35px;

    border-radius:24px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.25);

}


/* LOGO */


.logo-box{

    text-align:center;

    margin-bottom:30px;

}


.logo-icon{

    width:80px;

    height:80px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:40px;

    border-radius:50%;

    background:#eff6ff;

}


.logo-box h1{

    margin:15px 0 8px;

    font-size:24px;

}


.logo-box p{

    color:#64748b;

    margin:0;

}



/* INPUT */


.form-group{

    margin-bottom:18px;

}


label{

    display:block;

    margin-bottom:7px;

    font-weight:600;

}


input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #ddd;

    font-size:16px;

}


input:focus{

    outline:none;

    border-color:#2563eb;

}



/* BUTTON */


.login-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}


.login-btn:hover{

    background:#1d4ed8;

}



/* REGISTER */


.register-box{

    text-align:center;

    margin-top:25px;

    padding-top:20px;

    border-top:1px solid #eee;

}


.register-box a{

    color:#2563eb;

    font-weight:bold;

    text-decoration:none;

}



/* MESSAGE */


.message{

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    display:none;

    font-size:14px;

}


.message.show{

    display:block;

}


.success{

    background:#dcfce7;

    color:#166534;

}


.error{

    background:#fee2e2;

    color:#991b1b;

}



/* MOBILE */


@media(max-width:480px){

.auth-card{

    padding:25px;

}

.logo-box h1{

    font-size:21px;

}

}


</style>

</head>



<body>


<div class="auth-page">


<div class="auth-card">


<div class="logo-box">


<div class="logo-icon">

🏪

</div>


<h1>

ဝန်ဆောင်မှုပေးသူ Login

</h1>


<p>

ဆိုင်ကို စီမံခန့်ခွဲရန် ဝင်ရောက်ပါ

</p>


</div>




<form id="loginForm">



<div class="form-group">


<label>

Email

</label>


<input

type="email"

id="email"

placeholder="ဆိုင် Email"

required

>


</div>





<div class="form-group">


<label>

Password

</label>


<input

type="password"

id="password"

placeholder="Password"

required

>


</div>





<button

class="login-btn"

type="submit"

>

ဝင်မယ်

</button>


</form>




<div

id="message"

class="message"

></div>





<div class="register-box">


<p>

ဆိုင်အသစ်တင်ချင်ပါသလား?

</p>


<a href="provider-register.html">

🏪 ဆိုင်စာရင်းသွင်းရန်

</a>


</div>




</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/auth.js"></script>



<script>


const form =
document.getElementById("loginForm");


const message =
document.getElementById("message");



form.addEventListener(
"submit",
async(e)=>{


e.preventDefault();



try{


await loginUser(

document.getElementById("email").value,

document.getElementById("password").value

);



message.innerHTML =
"Login အောင်မြင်ပါပြီ";

message.className =
"message show success";



setTimeout(()=>{

window.location.href="index.html";

},800);



}

catch(error){


message.innerHTML =
error.message;


message.className =
"message show error";


}


});



</script>


</body>

</html>
