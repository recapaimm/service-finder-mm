<!DOCTYPE html>
<html lang="my">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ဆိုင်စာရင်းသွင်းရန် | အနီးအနားဝန်ဆောင်မှု</title>


<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/provider.css">
<link rel="stylesheet" href="css/responsive.css">


</head>


<body>


<main class="provider-register-page">


<section class="provider-register-card">


<div class="provider-register-header">


<div class="provider-register-icon">
🏪
</div>


<h1>
ဆိုင်စာရင်းသွင်းရန်
</h1>


<p>
သင့်ဆိုင်ကို အနီးအနားဝန်ဆောင်မှုတွင် စာရင်းသွင်းပါ
</p>


</div>




<div class="provider-register-notice">

<strong>
📋 အရေးကြီးပါသည်
</strong>


<p>
စာရင်းသွင်းပြီးနောက် Admin မှ စစ်ဆေးပြီး
အတည်ပြုပေးပါမည်။
</p>


</div>





<form id="providerRegisterForm">



<div class="provider-form-group">

<label>
ပိုင်ရှင်အမည်
</label>

<input
type="text"
id="providerFullName"
placeholder="ပိုင်ရှင်အမည်ထည့်ပါ"
required
>

</div>





<div class="provider-form-group">

<label>
ဆိုင်အမည်
</label>

<input
type="text"
id="providerShopName"
placeholder="ဆိုင်အမည်ထည့်ပါ"
required
>

</div>





<div class="provider-form-group">

<label>
ဖုန်းနံပါတ်
</label>

<input
type="tel"
id="providerPhone"
placeholder="09xxxxxxxxx"
required
>

</div>





<div class="provider-form-group">

<label>
Email
</label>

<input
type="email"
id="providerEmail"
placeholder="example@gmail.com"
required
>

</div>





<div class="provider-form-group">


<label>
ဝန်ဆောင်မှုအမျိုးအစား
</label>


<select id="providerCategory" required>


<option value="">
အမျိုးအစားရွေးပါ
</option>


<option value="phone">
📱 ဖုန်းပြင်ဆိုင်
</option>


<option value="computer">
💻 ကွန်ပျူတာ
</option>


<option value="motorcycle">
🛵 ဆိုင်ကယ်ပြင်
</option>


<option value="car">
🚗 ကားပြင်
</option>


<option value="aircon">
❄️ အဲကွန်း
</option>


<option value="electrical">
⚡ လျှပ်စစ်
</option>


<option value="plumbing">
🚰 ရေပိုက်
</option>


<option value="other">
🛠️ အခြား
</option>


</select>


</div>






<div class="provider-form-group">


<label>
ဆိုင်လိပ်စာ
</label>


<textarea
id="providerAddress"
rows="4"
placeholder="ဆိုင်တည်ရှိရာ လိပ်စာ"
required
></textarea>


</div>






<div class="provider-form-group">


<label>
Password
</label>


<input
type="password"
id="providerPassword"
placeholder="အနည်းဆုံး 6 လုံး"
required
>


</div>






<div class="provider-form-group">


<label>
Password ပြန်ထည့်ပါ
</label>


<input
type="password"
id="providerConfirmPassword"
placeholder="Password ပြန်ထည့်ပါ"
required
>


</div>







<button
type="submit"
id="providerRegisterBtn"
class="provider-register-submit"
>

🏪 ဆိုင်စာရင်းသွင်းမယ်

</button>





</form>





<div
id="providerRegisterMessage"
class="provider-auth-message"
>

</div>







<div class="provider-login-link">

အကောင့်ရှိပြီးသားလား?

<a href="login.html">
ဆိုင်သမားဝင်ရန်
</a>


</div>





<a
href="index.html"
class="provider-back-home"
>

← ပင်မစာမျက်နှာသို့ ပြန်မယ်

</a>




</section>


</main>






<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="js/auth.js"></script>


<script src="js/provider.js"></script>



</body>


    </html>
