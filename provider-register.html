<!DOCTYPE html>
<html lang="my">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ဆိုင်စာရင်းသွင်းရန် | အနီးအနားဝန်ဆောင်မှု</title>

    <meta
        name="description"
        content="အနီးအနားဝန်ဆောင်မှုတွင် ဆိုင်နှင့်ဝန်ဆောင်မှု စာရင်းသွင်းရန်"
    >

    <!-- ================================
         CSS
    ================================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/provider.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


    <!-- =================================
         PROVIDER REGISTER
    ================================= -->

    <main class="provider-register-page">

        <section class="provider-register-card">


            <!-- =========================
                 HEADER
            ========================== -->

            <div class="provider-register-header">

                <div class="provider-register-icon">
                    🏪
                </div>

                <h1>
                    ဆိုင်စာရင်းသွင်းရန်
                </h1>

                <p>
                    သင့်ဆိုင်နှင့် ဝန်ဆောင်မှုကို
                    အနီးအနားဝန်ဆောင်မှုတွင်
                    စာရင်းသွင်းပါ
                </p>

            </div>


            <!-- =========================
                 NOTICE
            ========================== -->

            <div class="provider-register-notice">

                <strong>
                    📋 အရေးကြီးပါသည်
                </strong>

                <p>
                    စာရင်းသွင်းပြီးပါက Admin မှ
                    သင့်ဆိုင်အချက်အလက်များကို
                    စစ်ဆေးပေးမည်ဖြစ်ပါသည်။
                </p>

                <p>
                    အတည်ပြုပြီးမှသာ
                    ဆိုင်အချက်အလက်များကို
                    အများမြင်နိုင်မည်ဖြစ်ပါသည်။
                </p>

            </div>


            <!-- =========================
                 REGISTER FORM
            ========================== -->

            <form
                id="providerRegisterForm"
                novalidate
            >


                <!-- =====================
                     OWNER NAME
                ====================== -->

                <div class="provider-form-group">

                    <label for="providerFullName">
                        ပိုင်ရှင်အမည်
                    </label>

                    <input
                        type="text"
                        id="providerFullName"
                        name="fullName"
                        placeholder="ပိုင်ရှင်အမည်ထည့်ပါ"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- =====================
                     SHOP NAME
                ====================== -->

                <div class="provider-form-group">

                    <label for="providerShopName">
                        ဆိုင်အမည်
                    </label>

                    <input
                        type="text"
                        id="providerShopName"
                        name="shopName"
                        placeholder="ဥပမာ - ကိုအောင် ဖုန်းပြင်ဆိုင်"
                        required
                    >

                </div>


                <!-- =====================
                     PHONE
                ====================== -->

                <div class="provider-form-group">

                    <label for="providerPhone">
                        ဖုန်းနံပါတ်
                    </label>

                    <input
                        type="tel"
                        id="providerPhone"
                        name="phone"
                        placeholder="09xxxxxxxxx"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >

                </div>


                <!-- =====================
                     EMAIL
                ====================== -->

                <div class="provider-form-group">

                    <label for="providerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="providerEmail"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        inputmode="email"
                        required
                    >

                    <small>
                        Login ဝင်ရာတွင်
                        ဒီ Email ကို အသုံးပြုရပါမယ်။
                    </small>

                </div>


                <!-- =====================
                     CATEGORY
                ====================== -->

                <div class="provider-form-group">

                    <label for="providerCategory">
                        ဝန်ဆောင်မှုအမျိုးအစား
                    </label>

                    <select
                        id="providerCategory"
                        name="category"
                        required
                    >

                        <option value="">
                            အမျိုးအစားရွေးပါ
                        </option>

                        <option value="phone">
                            📱 ဖုန်းပြင်ဆိုင်
                        </option>

                        <option value="computer">
                            💻 ကွန်ပျူတာပြင်ဆိုင်
                        </option>

                        <option value="motorcycle">
                            🛵 ဆိုင်ကယ်ပြင်ဆိုင်
                        </option
