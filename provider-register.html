<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ဆိုင်စာရင်းသွင်းရန် | အနီးအနားဝန်ဆောင်မှု</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/provider.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main class="provider-register-page">

        <section class="provider-register-card">

            <!-- Header -->
            <div class="provider-register-header">

                <div class="provider-register-icon">
                    🏪
                </div>

                <h1>ဆိုင်စာရင်းသွင်းရန်</h1>

                <p>
                    သင့်ဆိုင်ကို အနီးအနားဝန်ဆောင်မှုတွင်
                    စာရင်းသွင်းပါ
                </p>

            </div>


            <!-- Notice -->
            <div class="provider-register-notice">

                <strong>📋 အရေးကြီးပါသည်</strong>

                <p>
                    စာရင်းသွင်းပြီးနောက် သင့်ဆိုင်အချက်အလက်များကို
                    စစ်ဆေးပြီးမှ အတည်ပြုပေးမည်ဖြစ်ပါသည်။
                </p>

            </div>


            <!-- Registration Form -->
            <form id="providerRegisterForm">


                <!-- Owner Name -->
                <div class="provider-form-group">

                    <label for="providerFullName">
                        ပိုင်ရှင်အမည်
                    </label>

                    <input
                        type="text"
                        id="providerFullName"
                        placeholder="ပိုင်ရှင်အမည်ထည့်ပါ"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Shop Name -->
                <div class="provider-form-group">

                    <label for="providerShopName">
                        ဆိုင်အမည်
                    </label>

                    <input
                        type="text"
                        id="providerShopName"
                        placeholder="ဆိုင်အမည်ထည့်ပါ"
                        required
                    >

                </div>


                <!-- Phone -->
                <div class="provider-form-group">

                    <label for="providerPhone">
                        ဖုန်းနံပါတ်
                    </label>

                    <input
                        type="tel"
                        id="providerPhone"
                        placeholder="09xxxxxxxxx"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="provider-form-group">

                    <label for="providerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="providerEmail"
                        placeholder="ဆိုင် Email ထည့်ပါ"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Category -->
                <div class="provider-form-group">

                    <label for="providerCategory">
                        ဝန်ဆောင်မှုအမျိုးအစား
                    </label>

                    <select
                        id="providerCategory"
                        required
                    >

                        <option value="">
                            အမျိုးအစားရွေးပါ
                        </option>

                        <option value="phone">
                            📱 ဖုန်းပြင်ဆိုင်
                        </option>

                        <option value="motorcycle">
                            🛵 ဆိုင်ကယ်ပြင်ဆိုင်
                        </option>

                        <option value="car">
                            🚗 ကားပြင်ဆိုင်
                        </option>

                        <option value="aircon">
                            ❄️ အဲကွန်းဝန်ဆောင်မှု
                        </option>

                        <option value="electrical">
                            ⚡ လျှပ်စစ်ဝန်ဆောင်မှု
                        </option>

                        <option value="plumbing">
                            🔧 ရေပိုက်/ပိုက်ပြင်
                        </option>

                        <option value="other">
                            🛠️ အခြားဝန်ဆောင်မှု
                        </option>

                    </select>

                </div>


                <!-- Address -->
                <div class="provider-form-group">

                    <label for="providerAddress">
                        ဆိုင်လိပ်စာ
                    </label>

                    <textarea
                        id="providerAddress"
                        placeholder="ဆိုင်တည်ရှိရာ လိပ်စာထည့်ပါ"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <!-- Password -->
                <div class="provider-form-group">

                    <label for="providerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="providerPassword"
                        placeholder="အနည်းဆုံး 6 လုံး"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="provider-form-group">

                    <label for="providerConfirmPassword">
                        Password ပြန်ထည့်ပါ
                    </label>

                    <input
                        type="password"
                        id="providerConfirmPassword"
                        placeholder="Password ပြန်ထည့်ပါ"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="providerRegisterBtn"
                    class="provider-register-submit"
                >
                    🏪 ဆိုင်စာရင်းသွင်းမယ်
                </button>


            </form>


            <!-- Message -->
            <div
                id="providerRegisterMessage"
                class="provider-auth-message"
                role="alert"
            ></div>


            <!-- Login -->
            <div class="provider-login-link">

                <span>
                    အကောင့်ရှိပြီးသားလား?
                </span>

                <a href="login.html">
                    ဝင်ရောက်ရန်
                </a>

            </div>


            <!-- Home -->
            <a
                href="index.html"
                class="provider-back-home"
            >
                ← ပင်မစာမျက်နှာသို့ ပြန်မယ်
            </a>

        </section>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Auth -->
    <script src="js/auth.js"></script>

    <!-- Provider -->
    <script src="js/provider.js"></script>

</body>
  </html>
